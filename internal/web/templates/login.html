<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SWORD-GO Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h3 mb-1">SWORD-GO</h1>
                    <p class="text-muted mb-4">Login</p>

                    {{ if .Error }}
                    <div class="alert alert-danger" role="alert">{{ .Error }}</div>
                    {{ end }}

                    <form method="post" action="/login" class="vstack gap-3">
                        <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">
                        <label class="form-label mb-0">
                            Email
                            <input class="form-control mt-1" name="email" type="email" required>
                        </label>
                        <label class="form-label mb-0">
                            Password
                            <input class="form-control mt-1" name="password" type="password" required>
                        </label>
                        <button class="btn btn-primary w-100" type="submit">Sign in</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
