{{ define "app-styles" }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
<style>
    :root { --admin-primary: #4e73df; --admin-dark: #224abe; --admin-bg: #f8f9fc; --admin-text: #5a5c69; }
    body { background: var(--admin-bg) !important; color: var(--admin-text); font-family: Nunito, system-ui, sans-serif; }
    main.container { max-width: 1440px; }
    h1, h2, h3, h4, h5, h6 { color: #3a3b45; font-weight: 700; }
    .app-navigation { background: linear-gradient(135deg, var(--admin-dark), var(--admin-primary)); border-radius: .5rem; padding: .75rem 1rem; }
    .app-navigation .brand { color: #fff; font-size: 1.05rem; font-weight: 800; letter-spacing: .04em; text-decoration: none; white-space: nowrap; }
    .app-navigation .nav-link { border-radius: .35rem; color: rgba(255,255,255,.8); font-size: .85rem; font-weight: 700; padding: .45rem .65rem; text-decoration: none; white-space: nowrap; }
    .app-navigation .nav-link:hover { background: rgba(255,255,255,.16); color: #fff; }
    .app-navigation .btn-logout { border-color: rgba(255,255,255,.5); color: #fff; }
    .app-navigation .btn-logout:hover { background: #fff; color: var(--admin-primary); }
    .card { border: 0; border-radius: .55rem; box-shadow: 0 .15rem 1.75rem 0 rgba(58,59,69,.13) !important; }
    .card-body { padding: 1.5rem; }
    .card h2 { border-left: .25rem solid var(--admin-primary); padding-left: .75rem; }
    .form-control, .form-select { border-color: #d1d3e2; color: #6e707e; }
    .form-control:focus, .form-select:focus { border-color: #bac8f3; box-shadow: 0 0 0 .2rem rgba(78,115,223,.15); }
    .btn-primary { background-color: var(--admin-primary); border-color: var(--admin-primary); box-shadow: 0 .125rem .25rem rgba(78,115,223,.25); }
    .btn-primary:hover { background-color: var(--admin-dark); border-color: var(--admin-dark); }
    .table { color: var(--admin-text); }
    .table thead th { background: #eaecf4; border-bottom: 0; color: #4e73df; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; }
    .table > :not(caption) > * > * { border-color: #eaecf4; padding: .85rem .75rem; }
    .alert { border: 0; box-shadow: 0 .125rem .5rem rgba(58,59,69,.1); }
    code, pre { border-radius: .35rem; }
    @media (max-width: 767.98px) { .app-navigation { align-items: stretch !important; } .app-navigation .brand { width: 100%; } }
</style>
{{ end }}
