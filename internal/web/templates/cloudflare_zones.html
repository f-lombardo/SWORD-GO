<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SWORD-GO Cloudflare Zones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body class="bg-light">
<main class="container py-4">
    <p><a class="btn btn-outline-secondary btn-sm" href="/cloudflare">← Back to Cloudflare integrations</a></p>
    <h1 class="h3 mb-3">Zones for {{ .Integration.Name }}</h1>

    <div class="card shadow-sm">
    <div class="card-body">
    <div class="table-responsive">
    <table class="table table-striped table-bordered align-middle mb-0">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Status</th>
            <th>Open</th>
        </tr>
        </thead>
        <tbody>
        {{ range .Zones }}
        <tr>
            <td>{{ index . "id" }}</td>
            <td>{{ index . "name" }}</td>
            <td>{{ index . "status" }}</td>
            <td><a href="/cloudflare/{{ $.Integration.ID }}/{{ index . "id" }}">Open zone</a></td>
        </tr>
        {{ else }}
        <tr><td colspan="4">No zones found.</td></tr>
        {{ end }}
        </tbody>
    </table>
    </div>
    </div>
    </div>
</main>
</body>
</html>
