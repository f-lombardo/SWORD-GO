<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SWORD-GO Backup Schedules</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body class="bg-light">
<main class="container py-4">
    <header class="mb-4">
        <h1 class="h3 mb-2">Backup Schedules</h1>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-secondary btn-sm" href="/servers">Servers</a>
            <a class="btn btn-outline-secondary btn-sm" href="/sites">Sites</a>
            <a class="btn btn-outline-secondary btn-sm" href="/backup-destinations">Backup destinations</a>
            <a class="btn btn-outline-secondary btn-sm" href="/settings/integrations">Integrations</a>
            <a class="btn btn-outline-secondary btn-sm" href="/cloudflare">Cloudflare</a>
        </div>
    </header>

    <div class="card shadow-sm">
    <div class="card-body">
    <div class="table-responsive">
    <table class="table table-striped table-bordered align-middle mb-0">
        <thead>
        <tr>
            <th>ID</th>
            <th>Server</th>
            <th>Destination</th>
            <th>Frequency</th>
            <th>Time</th>
            <th>Enabled</th>
        </tr>
        </thead>
        <tbody>
        {{ range .Schedules }}
        <tr>
            <td>{{ .ID }}</td>
            <td>{{ .ServerID }}</td>
            <td>{{ .BackupDestinationID }}</td>
            <td>{{ .Frequency }}</td>
            <td>{{ .Time }}</td>
            <td>{{ .IsEnabled }}</td>
        </tr>
        {{ else }}
        <tr><td colspan="6">No schedules yet.</td></tr>
        {{ end }}
        </tbody>
    </table>
    </div>
    </div>
    </div>
</main>
</body>
</html>
