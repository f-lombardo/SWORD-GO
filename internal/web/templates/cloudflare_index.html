<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SWORD-GO Cloudflare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body class="bg-light">
<main class="container py-4">
    <header class="mb-4">
        <h1 class="h3 mb-2">Cloudflare</h1>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-secondary btn-sm" href="/settings/integrations">Integrations</a>
            <a class="btn btn-outline-secondary btn-sm" href="/servers">Servers</a>
        </div>
    </header>

    <section class="card shadow-sm">
        <div class="card-body">
        <h2 class="h5 mb-3">Cloudflare integrations</h2>
        <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle mb-0">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Provider</th>
                <th>Open zones</th>
            </tr>
            </thead>
            <tbody>
            {{ range .Integrations }}
            <tr>
                <td>{{ .ID }}</td>
                <td>{{ .Name }}</td>
                <td>{{ .Provider }}</td>
                <td><a href="/cloudflare/{{ .ID }}">View zones</a></td>
            </tr>
            {{ else }}
            <tr><td colspan="4">No Cloudflare integration configured.</td></tr>
            {{ end }}
            </tbody>
        </table>
        </div>
        </div>
    </section>
</main>
</body>
</html>
