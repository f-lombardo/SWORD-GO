services:
  sword-go:
    build:
      context: .
      dockerfile: Dockerfile
    image: sword-go:latest
    container_name: sword-go
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "${SWORD_GO_HTTP_PORT:-8088}:8088"
    volumes:
      - sword_go_data:/var/lib/sword-go
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  sword_go_data:
